[package]
name = "hlsearch"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
log = "0.4"
simple_logger = "5.0"
rayon = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cudarc = { version = "0.19.9", optional = true, default-features = false, features = ["driver", "nvrtc", "cuda-11080", "dynamic-linking"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
