[package]
name = "hlsearch"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
log = "0.4"
simple_logger = "5.0"
rayon = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
rocksdb = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
